name: Tests und Windows-Programm

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Tests
        run: python -m unittest -v

  exe:
    name: Windows-Programm (.exe)
    needs: tests
    runs-on: windows-latest
    permissions:
      contents: write  # für das Release, aus dem sich die .exe selbst aktualisiert
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Versionsnummer eintragen (Build = Laufnummer)
        run: python -c "open('n3xtbyt3/_version.py', 'w', encoding='utf-8').write('BUILD = ${{ github.run_number }}\n')"
      - name: .exe bauen
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed --name N3XTBYT3
          --add-data "daten;daten"
          --add-data "n3xtbyt3/oberflaeche/schriften;n3xtbyt3/oberflaeche/schriften"
          start_n3xtbyt3.py
      - name: Selbsttest der .exe (alle Szenarien laden und lösen)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\N3XTBYT3.exe" -ArgumentList "--selbsttest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Selbsttest fehlgeschlagen (Exit-Code $($p.ExitCode))" }
          Write-Host "Selbsttest bestanden."
      - name: .exe zum Herunterladen bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: N3XTBYT3-Windows
          path: dist/N3XTBYT3.exe
          retention-days: 30
      - name: MCP-Server als .exe bauen (Konsole, für Claude Desktop)
        run: >
          pyinstaller --noconfirm --onefile --console --name N3XTBYT3-MCP
          --add-data "daten;daten"
          --add-data "vorlagen;vorlagen"
          start_mcp.py
      - name: Selbsttest des MCP-Servers
        shell: pwsh
        run: |
          $antwort = '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | .\dist\N3XTBYT3-MCP.exe
          Write-Host $antwort
          if ($antwort -notmatch 'auswertung_lesen') { throw "MCP-Server antwortet nicht wie erwartet" }
          $auswertung = '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"auswertung_lesen","arguments":{"system":"windows"}}}' | .\dist\N3XTBYT3-MCP.exe
          if ($auswertung -notmatch 'Auswertung Windows') { throw "Auswertung kommt nicht an" }
          Write-Host "MCP-Selbsttest bestanden."
      - name: MCP-.exe zum Herunterladen bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: N3XTBYT3-MCP-Windows
          path: dist/N3XTBYT3-MCP.exe
          retention-days: 30
      - name: Release veröffentlichen (für das Selbst-Update und den festen Download-Link)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $hash = (Get-FileHash dist\N3XTBYT3.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  N3XTBYT3.exe" | Set-Content -NoNewline -Encoding utf8NoBOM dist\N3XTBYT3.exe.sha256
          $tag = "build-${{ github.run_number }}"
          gh release create $tag dist\N3XTBYT3.exe dist\N3XTBYT3.exe.sha256 dist\N3XTBYT3-MCP.exe `
            --repo "${{ github.repository }}" --target "${{ github.sha }}" --latest `
            --title "N3XTBYT3 Build ${{ github.run_number }}" `
            --notes "Automatisch gebaut aus ${{ github.sha }}. Die .exe aktualisiert sich beim Start selbst auf den neuesten Build."
      - name: Alte Releases aufräumen (die neuesten 10 bleiben)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $alle = gh release list --repo "${{ github.repository }}" --limit 200 --json tagName,createdAt | ConvertFrom-Json
          $alt = $alle | Where-Object { $_.tagName -like 'build-*' } | Sort-Object createdAt -Descending | Select-Object -Skip 10
          foreach ($r in $alt) { gh release delete $r.tagName --repo "${{ github.repository }}" --yes --cleanup-tag }
